<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeonSync</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080810;
    --panel: #0d0d1a;
    --border: #1a1a30;
    --neon: #00ffcc;
    --neon2: #ff2d78;
    --neon3: #7b5ea7;
    --text: #c8d0e0;
    --text-dim: #505870;
    --mono: 'Share Tech Mono', monospace;
    --display: 'Rajdhani', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--display);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* animated grid bg */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,255,204,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,204,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: relative;
    z-index: 1;
    padding: 28px 40px 18px;
    display: flex;
    align-items: flex-end;
    gap: 20px;
    border-bottom: 1px solid var(--border);
  }

  .logo {
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.2;
    color: var(--neon);
    text-shadow: 0 0 12px var(--neon);
    white-space: pre;
  }

  .title-block h1 {
    font-size: 42px;
    font-weight: 700;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: #fff;
    text-shadow: 0 0 30px var(--neon), 0 0 60px rgba(0,255,204,0.3);
  }
  .title-block p {
    font-size: 13px;
    letter-spacing: 3px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-top: 2px;
  }

  #status-pill {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 12px;
    padding: 6px 16px;
    border-radius: 2px;
    border: 1px solid var(--border);
    text-transform: uppercase;
    letter-spacing: 2px;
    transition: all 0.3s;
  }
  #status-pill .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--text-dim);
    transition: background 0.3s, box-shadow 0.3s;
  }
  #status-pill.syncing { border-color: var(--neon); color: var(--neon); }
  #status-pill.syncing .dot {
    background: var(--neon);
    box-shadow: 0 0 8px var(--neon);
    animation: pulse 1.2s ease-in-out infinite;
  }
  #status-pill.error { border-color: var(--neon2); color: var(--neon2); }
  #status-pill.error .dot { background: var(--neon2); box-shadow: 0 0 8px var(--neon2); }
  #status-pill.locked { border-color: #ffcc00; color: #ffcc00; }
  #status-pill.locked .dot { background: #ffcc00; box-shadow: 0 0 8px #ffcc00; }

  .btn-unlock {
    width: 100%;
    margin-top: 10px;
    padding: 11px;
    border: 1px solid #ffcc00;
    background: rgba(255,204,0,0.06);
    color: #ffcc00;
    font-family: var(--display);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.2s;
    display: none;
  }
  .btn-unlock:hover { background: rgba(255,204,0,0.14); box-shadow: 0 0 16px rgba(255,204,0,0.2); }
  .btn-unlock.visible { display: block; }

  @keyframes pulse {
    0%,100% { opacity: 1; } 50% { opacity: 0.3; }
  }

  main {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 0;
    min-height: calc(100vh - 90px);
  }

  /* ─── LEFT PANEL ─── */
  .left-panel {
    border-right: 1px solid var(--border);
    padding: 30px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  .section-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* Color preview orb */
  #color-orb-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  #color-orb {
    width: 130px; height: 130px;
    border-radius: 50%;
    background: #111;
    position: relative;
    transition: background 0.15s ease, box-shadow 0.15s ease;
    border: 2px solid rgba(255,255,255,0.06);
  }
  #color-orb::after {
    content: '';
    position: absolute;
    inset: -12px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--orb-color, #111) 0%, transparent 70%);
    opacity: 0.4;
    filter: blur(8px);
    transition: background 0.15s;
  }

  #rgb-display {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--neon);
    letter-spacing: 2px;
  }

  #hex-display {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 3px;
  }

  /* RGB bars */
  .rgb-bars { display: flex; flex-direction: column; gap: 10px; }
  .rgb-bar-row { display: flex; align-items: center; gap: 10px; }
  .rgb-bar-row label {
    font-family: var(--mono);
    font-size: 11px;
    width: 16px;
    letter-spacing: 1px;
  }
  .bar-track {
    flex: 1;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.15s ease;
  }
  .bar-r .bar-fill { background: linear-gradient(90deg, #300, var(--neon2)); }
  .bar-g .bar-fill { background: linear-gradient(90deg, #030, #00ff88); }
  .bar-b .bar-fill { background: linear-gradient(90deg, #003, #00aaff); }
  .bar-val {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    width: 28px;
    text-align: right;
  }

  /* Controls */
  .control-group { display: flex; flex-direction: column; gap: 16px; }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  .field input[type="text"],
  .field select {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    padding: 9px 12px;
    border-radius: 2px;
    outline: none;
    transition: border-color 0.2s;
    letter-spacing: 1px;
  }
  .field input:focus, .field select:focus { border-color: var(--neon); box-shadow: 0 0 0 1px var(--neon); }

  .field input[type="range"] {
    -webkit-appearance: none;
    width: 100%;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
  }
  .field input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--neon);
    box-shadow: 0 0 8px var(--neon);
    cursor: pointer;
    transition: transform 0.1s;
  }
  .field input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.3); }

  .range-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .range-label { font-family: var(--mono); font-size: 10px; color: var(--text-dim); }
  .range-val { font-family: var(--mono); font-size: 12px; color: var(--neon); min-width: 32px; text-align: right; }

  /* Buttons */
  .btn-row { display: flex; gap: 10px; margin-top: 4px; }

  .btn {
    flex: 1;
    padding: 12px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-family: var(--display);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.2s;
  }
  .btn:hover { background: rgba(255,255,255,0.04); }

  .btn-start {
    border-color: var(--neon);
    color: var(--neon);
    text-shadow: 0 0 8px var(--neon);
  }
  .btn-start:hover {
    background: rgba(0,255,204,0.08);
    box-shadow: 0 0 20px rgba(0,255,204,0.2);
  }
  .btn-stop { border-color: var(--neon2); color: var(--neon2); }
  .btn-stop:hover { background: rgba(255,45,120,0.08); }
  .btn-discover { font-size: 12px; letter-spacing: 2px; flex: 0 0 auto; padding: 12px 16px; }

  /* ─── RIGHT PANEL ─── */
  .right-panel { padding: 30px; display: flex; flex-direction: column; gap: 28px; }

  /* History wave */
  #history-canvas {
    width: 100%;
    height: 90px;
    display: block;
    border: 1px solid var(--border);
    border-radius: 2px;
  }

  /* Manual color picker */
  .color-picker-section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 20px;
  }

  .color-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 16px;
  }
  .preset-swatch {
    width: 40px; height: 40px;
    border-radius: 2px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
    position: relative;
  }
  .preset-swatch:hover {
    transform: scale(1.15);
    border-color: rgba(255,255,255,0.4);
  }
  .preset-swatch.active {
    border-color: #fff;
    box-shadow: 0 0 16px rgba(255,255,255,0.4);
  }

  .manual-rgb-row {
    display: flex;
    gap: 12px;
    margin-top: 16px;
    align-items: flex-end;
  }
  .manual-rgb-row .field { flex: 1; }
  .manual-rgb-row input[type="number"] {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    padding: 9px 10px;
    border-radius: 2px;
    outline: none;
    width: 100%;
    transition: border-color 0.2s;
  }
  .manual-rgb-row input:focus { border-color: var(--neon); }
  .btn-send {
    padding: 10px 22px;
    background: transparent;
    border: 1px solid var(--neon);
    color: var(--neon);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 2px;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.2s;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .btn-send:hover { background: rgba(0,255,204,0.1); box-shadow: 0 0 12px rgba(0,255,204,0.2); }

  /* Log */
  .log-section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 20px;
    flex: 1;
  }
  #log {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    line-height: 1.8;
    max-height: 160px;
    overflow-y: auto;
  }
  #log .log-time { color: var(--neon3); }
  #log .log-ok { color: var(--neon); }
  #log .log-err { color: var(--neon2); }

  /* Discovered devices */
  #devices-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 10px;
  }
  .device-item {
    font-family: var(--mono);
    font-size: 12px;
    padding: 8px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 2px;
    cursor: pointer;
    transition: border-color 0.2s;
    display: flex;
    justify-content: space-between;
  }
  .device-item:hover { border-color: var(--neon); color: var(--neon); }
  .device-item .device-ip { color: var(--neon); }

  /* scrollbar */
  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .fps-badge {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 1px;
    margin-left: auto;
  }
</style>
</head>
<body>

<header>
  <div class="logo">█▀▀\n█  \n▀▀▀</div>
  <div class="title-block">
    <h1>NeonSync</h1>
    <p>Magic Home · Screen Color Bridge</p>
  </div>
  <div id="status-pill">
    <div class="dot"></div>
    <span id="status-text">IDLE</span>
    <span class="fps-badge" id="fps-badge"></span>
  </div>
</header>

<main>
  <!-- LEFT -->
  <div class="left-panel">

    <!-- Live color -->
    <div>
      <div class="section-label">Live Color</div>
      <div id="color-orb-wrap">
        <div id="color-orb"></div>
        <div id="rgb-display">R:0 G:0 B:0</div>
        <div id="hex-display">#000000</div>
      </div>
      <div class="rgb-bars" style="margin-top:20px">
        <div class="rgb-bar-row bar-r">
          <label>R</label>
          <div class="bar-track"><div class="bar-fill" id="bar-r" style="width:0%"></div></div>
          <div class="bar-val" id="val-r">0</div>
        </div>
        <div class="rgb-bar-row bar-g">
          <label>G</label>
          <div class="bar-track"><div class="bar-fill" id="bar-g" style="width:0%"></div></div>
          <div class="bar-val" id="val-g">0</div>
        </div>
        <div class="rgb-bar-row bar-b">
          <label>B</label>
          <div class="bar-track"><div class="bar-fill" id="bar-b" style="width:0%"></div></div>
          <div class="bar-val" id="val-b">0</div>
        </div>
      </div>
    </div>

    <!-- Config -->
    <div>
      <div class="section-label">Configuration</div>
      <div class="control-group">
        <div class="field">
          <label>Controller IP</label>
          <div style="display:flex;gap:8px">
            <input type="text" id="ip-input" placeholder="192.168.1.X" />
            <button class="btn btn-discover" onclick="discover()">Scan</button>
          </div>
          <div id="devices-list"></div>
        </div>

        <div class="field">
          <label>Screen Region</label>
          <select id="region-select">
            <option value="full">Full Screen</option>
            <option value="left">Left Half</option>
            <option value="right">Right Half</option>
            <option value="top">Top Half</option>
            <option value="bottom">Bottom Half</option>
            <option value="center">Center</option>
          </select>
        </div>

        <div class="field">
          <div class="range-row">
            <label>Update Rate</label>
            <span class="range-val" id="fps-val">10</span>
            <span class="range-label">fps</span>
          </div>
          <input type="range" id="fps-slider" min="1" max="30" value="10" oninput="updateRange('fps')">
        </div>

        <div class="field">
          <div class="range-row">
            <label>Smoothing</label>
            <span class="range-val" id="smooth-val">0.4</span>
          </div>
          <input type="range" id="smooth-slider" min="0.05" max="1" step="0.05" value="0.4" oninput="updateRange('smooth')">
        </div>

        <div class="field">
          <div class="range-row">
            <label>Brightness</label>
            <span class="range-val" id="bright-val">100</span>
            <span class="range-label">%</span>
          </div>
          <input type="range" id="bright-slider" min="0" max="100" value="100" oninput="updateRange('bright')">
        </div>

        <div class="btn-row">
          <button class="btn btn-start" onclick="startSync()">▶ Start</button>
          <button class="btn btn-stop" onclick="stopSync()">■ Stop</button>
        </div>
      </div>
    </div>

  </div>

  <!-- RIGHT -->
  <div class="right-panel">

    <div>
      <div class="section-label">Color History</div>
      <canvas id="history-canvas"></canvas>
    </div>

    <div class="color-picker-section">
      <div class="section-label">Manual Override</div>
      <div class="color-grid" id="preset-swatches"></div>
      <div class="manual-rgb-row">
        <div class="field"><label>R</label><input type="number" id="mr" min="0" max="255" value="255"></div>
        <div class="field"><label>G</label><input type="number" id="mg" min="0" max="255" value="0"></div>
        <div class="field"><label>B</label><input type="number" id="mb" min="0" max="255" value="128"></div>
        <button class="btn-send" onclick="sendManualColor()">Send →</button>
      </div>
      <button class="btn-unlock" id="btn-unlock" onclick="unlockColor()">↺ Follow Screen</button>
    </div>

    <div class="log-section">
      <div class="section-label">System Log</div>
      <div id="log"></div>
    </div>

  </div>
</main>

<script>
// ── Presets
const PRESETS = [
  [255, 0, 80],   [255, 40, 0],  [255, 160, 0],
  [0, 255, 80],   [0, 200, 255], [0, 80, 255],
  [180, 0, 255],  [255, 255, 255],[255, 120, 0],
  [0, 255, 200],  [255, 0, 180], [100, 255, 0],
];

const swatchContainer = document.getElementById('preset-swatches');
PRESETS.forEach(([r,g,b]) => {
  const el = document.createElement('div');
  el.className = 'preset-swatch';
  el.style.background = `rgb(${r},${g},${b})`;
  el.style.boxShadow = `0 0 12px rgba(${r},${g},${b},0.6)`;
  el.onclick = () => {
    document.getElementById('mr').value = r;
    document.getElementById('mg').value = g;
    document.getElementById('mb').value = b;
    document.querySelectorAll('.preset-swatch').forEach(s => s.classList.remove('active'));
    el.classList.add('active');
    sendManualColor();
  };
  swatchContainer.appendChild(el);
});

// ── History canvas
const canvas = document.getElementById('history-canvas');
const ctx = canvas.getContext('2d');
const colorHistory = [];
const MAX_HIST = 200;

function resizeCanvas() {
  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

function drawHistory() {
  const {width:w, height:h} = canvas;
  ctx.clearRect(0, 0, w, h);

  if (colorHistory.length < 2) return;

  const step = w / MAX_HIST;
  // Draw as a gradient fill
  colorHistory.forEach(([r,g,b], i) => {
    const x = i * step;
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, `rgba(${r},${g},${b},0.9)`);
    grad.addColorStop(1, `rgba(${r},${g},${b},0.05)`);
    ctx.fillStyle = grad;
    ctx.fillRect(x, 0, step + 1, h);
  });
}

// ── Logging
const logEl = document.getElementById('log');
function addLog(msg, type='') {
  const t = new Date().toLocaleTimeString('en', {hour12:false});
  const line = document.createElement('div');
  line.innerHTML = `<span class="log-time">[${t}]</span> <span class="${'log-'+type}">${msg}</span>`;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
  if (logEl.children.length > 50) logEl.removeChild(logEl.firstChild);
}

// ── State polling
let lastStatus = '';
let lastRgb = '';

async function poll() {
  try {
    const res = await fetch('/api/state');
    const s = await res.json();

    // Color orb
    const [r,g,b] = s.current_rgb;
    const hex = '#' + [r,g,b].map(v => v.toString(16).padStart(2,'0')).join('');
    document.getElementById('color-orb').style.background = `rgb(${r},${g},${b})`;
    document.getElementById('color-orb').style.boxShadow = `0 0 30px rgba(${r},${g},${b},0.8), 0 0 60px rgba(${r},${g},${b},0.3)`;
    document.getElementById('color-orb').style.setProperty('--orb-color', `rgb(${r},${g},${b})`);
    document.getElementById('rgb-display').textContent = `R:${r}  G:${g}  B:${b}`;
    document.getElementById('hex-display').textContent = hex;
    document.getElementById('bar-r').style.width = (r/255*100)+'%';
    document.getElementById('bar-g').style.width = (g/255*100)+'%';
    document.getElementById('bar-b').style.width = (b/255*100)+'%';
    document.getElementById('val-r').textContent = r;
    document.getElementById('val-g').textContent = g;
    document.getElementById('val-b').textContent = b;

    // History
    const key = `${r},${g},${b}`;
    if (key !== lastRgb) {
      colorHistory.push([r,g,b]);
      if (colorHistory.length > MAX_HIST) colorHistory.shift();
      drawHistory();
      lastRgb = key;
    }

    // Status pill
    const pill = document.getElementById('status-pill');
    const txt = document.getElementById('status-text');
    const fpsBadge = document.getElementById('fps-badge');
    txt.textContent = s.status.toUpperCase();
    fpsBadge.textContent = s.running ? `${s.fps}fps` : '';
    pill.className = '';
    if (s.status === 'syncing') pill.classList.add('syncing');
    else if (s.status === 'locked') pill.classList.add('locked');
    else if (s.status.startsWith('error')) pill.classList.add('error');

    // Show/hide unlock button
    const unlockBtn = document.getElementById('btn-unlock');
    if (s.color_locked) unlockBtn.classList.add('visible');
    else unlockBtn.classList.remove('visible');

    // Log status changes
    if (s.status !== lastStatus) {
      addLog(s.status, s.status.startsWith('error') ? 'err' : 'ok');
      lastStatus = s.status;
    }

    // Sync sliders if changed remotely
    document.getElementById('fps-slider').value = s.fps;
    document.getElementById('fps-val').textContent = s.fps;
    document.getElementById('smooth-slider').value = s.smoothing;
    document.getElementById('smooth-val').textContent = s.smoothing.toFixed(2);
    document.getElementById('bright-slider').value = Math.round(s.brightness * 100);
    document.getElementById('bright-val').textContent = Math.round(s.brightness * 100);
    if (!document.getElementById('ip-input').matches(':focus')) {
      document.getElementById('ip-input').value = s.ip;
    }
    document.getElementById('region-select').value = s.region;

  } catch(e) {}
}

setInterval(poll, 200);
poll();

// ── Controls
function updateRange(which) {
  if (which === 'fps') {
    const v = document.getElementById('fps-slider').value;
    document.getElementById('fps-val').textContent = v;
  } else if (which === 'smooth') {
    const v = parseFloat(document.getElementById('smooth-slider').value).toFixed(2);
    document.getElementById('smooth-val').textContent = v;
  } else if (which === 'bright') {
    const v = document.getElementById('bright-slider').value;
    document.getElementById('bright-val').textContent = v;
  }
  pushConfig();
}

function pushConfig() {
  fetch('/api/config', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({
      ip: document.getElementById('ip-input').value,
      fps: parseInt(document.getElementById('fps-slider').value),
      region: document.getElementById('region-select').value,
      smoothing: parseFloat(document.getElementById('smooth-slider').value),
      brightness: parseInt(document.getElementById('bright-slider').value) / 100,
    })
  });
}

document.getElementById('ip-input').addEventListener('change', pushConfig);
document.getElementById('region-select').addEventListener('change', pushConfig);

async function startSync() {
  pushConfig();
  await fetch('/api/start');
  addLog('Start requested', 'ok');
}

async function stopSync() {
  await fetch('/api/stop');
  addLog('Stop requested', '');
}

async function discover() {
  addLog('Scanning network...', '');
  document.getElementById('devices-list').innerHTML = '<div style="font-family:var(--mono);font-size:11px;color:var(--text-dim);padding:6px">Scanning...</div>';
  const res = await fetch('/api/discover');
  const devices = await res.json();
  const container = document.getElementById('devices-list');
  container.innerHTML = '';
  if (devices.length === 0) {
    container.innerHTML = '<div style="font-family:var(--mono);font-size:11px;color:var(--text-dim);padding:6px">No devices found</div>';
    addLog('No devices found', 'err');
  } else {
    devices.forEach(d => {
      const el = document.createElement('div');
      el.className = 'device-item';
      el.innerHTML = `<span class="device-ip">${d.ip}</span><span>${d.raw.substring(0,20)}</span>`;
      el.onclick = () => {
        document.getElementById('ip-input').value = d.ip;
        pushConfig();
        addLog(`Selected device: ${d.ip}`, 'ok');
      };
      container.appendChild(el);
      addLog(`Found device: ${d.ip}`, 'ok');
    });
  }
}

async function unlockColor() {
  await fetch('/api/unlock');
  addLog('Color unlocked — following screen', 'ok');
}

function sendManualColor() {
  const r = parseInt(document.getElementById('mr').value) || 0;
  const g = parseInt(document.getElementById('mg').value) || 0;
  const b = parseInt(document.getElementById('mb').value) || 0;
  fetch('/api/color', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify({r,g,b})
  });
  addLog(`Manual color → rgb(${r},${g},${b})`, 'ok');
}

addLog('NeonSync dashboard loaded', 'ok');
</script>
